<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jailbreak Gauntlet</title>
<!--
  Day-1 shell (setup): pick a victim, start a quick scan, watch the SSE stream, see the raw report.
  Owner of the real UI: C. Issue "[C] Report card UI": category table with pass@3 / pass^3 and
  BLOCKED counts, evidence quotes, trace link, the patch approval step, and a Before column on re-scans.
  SSE format: "event: <type>\ndata: <json>\n\n"; lines starting with ":" are heartbeats.
-->
<style>
  body { font: 15px/1.5 system-ui, sans-serif; max-width: 900px; margin: 40px auto; padding: 0 20px; color: #16181d; }
  #log { font: 13px/1.6 ui-monospace, Menlo, monospace; background: #f5f5f5; padding: 12px; border-radius: 8px; min-height: 120px; }
  pre { white-space: pre-wrap; font-size: 12px; }
  button, select { font: inherit; padding: 6px 10px; }
</style>
</head>
<body>
  <h1>Jailbreak Gauntlet</h1>
  <p>
    <select id="victim"></select>
    <button id="scan">Quick scan</button>
  </p>
  <div id="log"></div>
  <details><summary>Raw report</summary><pre id="report"></pre></details>
<script>
const $ = (id) => document.getElementById(id);
fetch('/api/victims').then(r => r.json()).then(v => $('victim').innerHTML = v.map(n => `<option>${n}</option>`).join(''));

$('scan').onclick = async () => {
  $('log').textContent = ''; $('report').textContent = '';
  const resp = await fetch('/api/scan', { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ target: { kind: 'zoo', name: $('victim').value }, mode: 'quick' }) });
  const reader = resp.body.getReader(), dec = new TextDecoder(); let buf = '';
  for (;;) {
    const { value, done } = await reader.read(); if (done) break;
    buf += dec.decode(value, { stream: true });
    let i;
    while ((i = buf.indexOf('\n\n')) >= 0) {
      const chunk = buf.slice(0, i); buf = buf.slice(i + 2);
      if (chunk.startsWith(':')) continue;
      const type = (chunk.match(/^event: (.*)$/m) || [])[1];
      const data = JSON.parse((chunk.match(/^data: (.*)$/m) || [])[1] || '{}');
      if (type === 'report') $('report').textContent = JSON.stringify(data, null, 2);
      else $('log').textContent += `${type}: ${data.message || JSON.stringify(data).slice(0, 160)}\n`;
    }
  }
};
</script>
</body>
</html>
